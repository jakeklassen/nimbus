[tools]
rust = { version = "1.98.1", components = "clippy,rustfmt" }

[tasks.build]
description = "Debug build: target/debug/nimbus.exe, with a console for logs"
run = "cargo build"

[tasks.release]
description = "Release build: target/release/nimbus.exe, ~15 MB, no console (takes ~4 min)"
run = "cargo build --release"
