[package]
name = "nimbus"
version = "0.1.0"
edition = "2024"
description = "A minimal weather app built with GPUI Kit"
publish = false

[dependencies]
gpui-kit = "0.6.6"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "unstable-locales"] }
sys-locale = "0.3"
dirs = "6"
futures = "0.3"

[target.'cfg(windows)'.dependencies]
windows-registry = "0.6"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
gpui-kit = { version = "0.6.6", features = ["test-support"] }

# Debug builds of GPUI and the text stack render slowly. Optimize them while
# this crate stays a quick, debuggable debug build.
[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-component = { opt-level = 3 }
gpui-kit = { opt-level = 3 }
gpui-kit-assets = { opt-level = 3 }
gpui-pre-macros = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }

# The shipped exe: about 15 MB instead of 25, at the cost of a release build
# that takes about 4 minutes instead of 1.5.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
