<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B2B2B"/>
      <stop offset="1" stop-color="#171717"/>
    </linearGradient>
    <linearGradient id="sun" gradientUnits="userSpaceOnUse" x1="130" y1="52" x2="206" y2="128">
      <stop offset="0" stop-color="#F6A878"/>
      <stop offset="1" stop-color="#DE6A47"/>
    </linearGradient>
    <!-- In user space, so every part of the cloud shares one gradient. -->
    <linearGradient id="cloud" gradientUnits="userSpaceOnUse" x1="0" y1="92" x2="0" y2="194">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D9DCE2"/>
    </linearGradient>
    <!-- One cloud shape, reused for the fill and, grown, for the gap it cuts in the sun. -->
    <g id="cloud-shape">
      <circle cx="82" cy="160" r="30"/>
      <circle cx="124" cy="138" r="46"/>
      <circle cx="170" cy="150" r="36"/>
      <rect x="52" y="148" width="154" height="46" rx="23"/>
    </g>
    <mask id="sun-gap" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
      <rect width="256" height="256" fill="#FFF"/>
      <use href="#cloud-shape" fill="#000" stroke="#000" stroke-width="16"/>
    </mask>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#tile)"/>
  <rect x="8.5" y="8.5" width="239" height="239" rx="55.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <circle cx="168" cy="90" r="42" fill="url(#sun)" mask="url(#sun-gap)"/>
  <use href="#cloud-shape" fill="url(#cloud)"/>
</svg>
